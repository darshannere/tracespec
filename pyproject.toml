[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracespec"
version = "0.1.0"
description = "Production agent traces become versioned regression test suites with CI gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "opentelemetry-proto>=1.26",
    "protobuf>=5.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "gepa>=0.1.4"]
optimizer = ["gepa>=0.1.4"]

[project.scripts]
tracespec = "tracespec.cli:app"

[tool.setuptools.packages.find]
include = ["tracespec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
